name: Build and push image

# A change landing on main runs the tests, then builds and pushes the image.
# There is no manual trigger.
on:
  push:
    branches: [main]
    paths:
      - "pii_redact_proxy/**"
      - "tests/**"
      - "Dockerfile"
      - "requirements.txt"
      - ".github/workflows/build.yml"
      - ".github/workflows/test.yml"

jobs:
  test:
    uses: ./.github/workflows/test.yml
    permissions:
      contents: read

  release:
    needs: test
    # amd64 only: no arm64 consumer today, and the image is built natively.
    runs-on: ubuntu-24.04
    # One release at a time, so two merges can't claim the same version.
    concurrency:
      group: release
      cancel-in-progress: false
    permissions:
      contents: write   # push the version tag
      packages: write
    env:
      REGISTRY: ghcr.io
      IMAGE_NAME: ${{ github.repository }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Patch bump from the highest vX.Y.Z tag; the first release is v0.1.0.
      - name: Next version
        id: version
        run: |
          LAST=$(git tag --list 'v*.*.*' --sort=-v:refname | head -n1)
          if [ -z "$LAST" ]; then
            NEXT=0.1.0
          else
            IFS=. read -r MAJOR MINOR PATCH <<< "${LAST#v}"
            NEXT="$MAJOR.$MINOR.$((PATCH + 1))"
          fi
          echo "version=$NEXT" >> "$GITHUB_OUTPUT"
          echo "short_sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ steps.version.outputs.version }}
            type=raw,value=latest
            type=sha

      # BUILD_SHA is stamped into the image, where /version reads it back.
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          provenance: false
          build-args: BUILD_SHA=${{ steps.version.outputs.short_sha }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Tag release
        run: |
          git tag "v${{ steps.version.outputs.version }}"
          git push origin "v${{ steps.version.outputs.version }}"

      - name: Report digest
        run: |
          ref="${REGISTRY}/${IMAGE_NAME,,}:${{ steps.version.outputs.version }}@${{ steps.build.outputs.digest }}"
          echo "$ref"
          echo "Pushed \`$ref\`" >> "$GITHUB_STEP_SUMMARY"
